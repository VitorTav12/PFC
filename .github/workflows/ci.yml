name: CI

# Roda a cada Pull Request aberto ou atualizado contra a branch principal.
on:
  pull_request:
    branches: [main]

# Permissões mínimas: a pipeline só precisa ler o código.
permissions:
  contents: read

# Um novo push no mesmo PR cancela a execução anterior (economiza minutos e evita resultado velho).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      # -m unit: somente tests/unit (sem app Flask, sem banco, sem rede).
      # Se nenhum teste for coletado o pytest retorna erro (exit code 5), então a checagem nunca passa vazia.
      - name: Executar testes unitários
        run: python -m pytest -m unit

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      # -m integration: somente tests/integration (Flask + banco SQLite em memória, criado do zero a cada execução).
      - name: Executar testes de integração
        run: python -m pytest -m integration

  linter:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar o Ruff
        run: python -m pip install -r requirements-dev.txt

      # Regras e limites versionados em ruff.toml. Qualquer violação reprova o job.
      - name: Executar o linter
        run: ruff check .
