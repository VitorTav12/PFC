<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="static/login.css">
    <title>Login</title>
</head>
<body>
    <header><a href="/">Login</a>
            <a href="/pais">Pais</a>
            <a href="/secretaria">Secretaria</a>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}" role="alert" style="padding: 10px; margin-bottom: 15px; border-radius: 4px;">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
        <form method="POST" action="/">

            <h1>Login</h1>

            <div class="input-box">
                <input placeholder="E-mail" type="text" name="email" required>
            </div>

            <div class="input-box">
                <input placeholder="Senha" type="password" name="senha" required>
            </div>

            <div>
                <label>
                    <input type="checkbox"  name="remember">
                    Lembrar minha Senha
                </label>
            </div>
            <button type="submit">Login</button>
        </form>
         
    </main>
</body>
</html>
