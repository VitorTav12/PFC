<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pais">Portal dos Pais</a>
            <div class="navbar-nav">
                <a class="nav-link text-danger" href="/logout">Sair</a>
            </div>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} p-3 mb-3 shadow-sm" role="alert">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="bg-white p-4 border rounded shadow-sm">
            <h1 class="h3 mb-3">Painel dos Pais</h1>
            <p class="text-secondary mb-0">Bem-vindo à área destinada aos responsáveis.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
