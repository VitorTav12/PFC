<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar Autorizado</title>
    <link href="https://cdn.jsdelivr.net/npm/dropdown-bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h3 class="mb-4 text-center">Cadastrar Novo Autorizado</h3>

            <form method="POST" action="/pais/autorizado/cadastrar">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>
                <div class="mb-3">
                    <label for="grau_parentesco" class="form-label">Grau de Parentesco / Relação</label>
                    <input type="text" class="form-control" id="grau_parentesco" name="grau_parentesco"
                        placeholder="Ex: Avô, Tio, Babá..." required>
                </div>
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Salvar Autorizado</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
