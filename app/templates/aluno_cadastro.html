<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('secretaria.cadastrar_aluno') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <h1>Cadastro do Aluno</h1>

        <div class="input-box">
            <input placeholder="Nome do aluno" type="text" name="nome" required id="nome">
        </div>

        <div class="input-box">
            <input placeholder="Numero de matricula" type="text" name="numero_matricula" required id="numero_matricula">
        </div>

        <div class="input-box">
            <input placeholder="Turma" type="text" name="turma" required id="turma">
        </div>

        <div class="mb-3">
            <label for="responsavel_id" class="form-label">Responsável</label>
            <select class="form-select" id="responsavel_id" name="responsavel_id" required>
                <option value="" selected disabled>Selecione o responsável...</option>
                {% for resp in responsaveis %}
                <option value="{{ resp.id }}">{{ resp.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Cadastrar Aluno</button>
    </form>

</body>

</html>
