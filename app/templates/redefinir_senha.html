<!DOCTYPE html>
<html lang="pt-br" class="h-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Nova senha</title>
</head>

<body class="d-flex flex-column h-100 bg-light">

    <main class="container my-auto" style="max-width: 480px;">
        <div class="bg-white p-4 border rounded shadow-sm">
            <h1 class="h4 mb-2">Criar nova senha</h1>
            <p class="text-secondary small">Use pelo menos 8 caracteres, com letras e números.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} p-2 mb-3" role="alert">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.redefinir_senha', token=token) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="nova_senha" class="form-label">Nova senha</label>
                    <input class="form-control" type="password" name="nova_senha" id="nova_senha" minlength="8"
                        required>
                </div>
                <div class="mb-3">
                    <label for="confirmacao" class="form-label">Confirme a nova senha</label>
                    <input class="form-control" type="password" name="confirmacao" id="confirmacao" minlength="8"
                        required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Salvar nova senha</button>
            </form>
        </div>
    </main>

    {% include '_rodape_lgpd.html' %}
</body>

</html>
