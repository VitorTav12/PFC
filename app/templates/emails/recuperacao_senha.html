<!DOCTYPE html>
<html lang="pt-br">

<body style="font-family: Arial, sans-serif; color: #212529; background: #f8f9fa; padding: 24px;">
    <div
        style="max-width: 520px; margin: 0 auto; background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 24px;">
        <h2 style="margin-top: 0;">Recuperação de senha</h2>
        <p>Olá, {{ nome }}.</p>
        <p>Recebemos um pedido para criar uma nova senha no Portal de Controle de Saída.</p>
        <p style="text-align: center; margin: 28px 0;">
            <a href="{{ link }}"
                style="background: #0d6efd; color: #ffffff; padding: 12px 20px; border-radius: 6px; text-decoration: none;">Criar
                nova senha</a>
        </p>
        <p style="font-size: 14px; color: #6c757d;">O link vale por {{ minutos }} minutos e só pode ser usado uma
            vez.</p>
        <p style="font-size: 14px; color: #6c757d;">Se você não pediu a recuperação, ignore este e-mail. Sua senha
            atual continua valendo.</p>
    </div>
</body>

</html>
